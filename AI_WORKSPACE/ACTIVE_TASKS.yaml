    result_sha_on_feat_initial_engine: c80b1ce54ddbdedf615cb88942fdd7e68c77b613
    merged_by: Binz2008-star
    ci: >-
      SUCCESS on final_sha c9054f6 - independently verified by this agent
      via GitHub check-runs API before the operator merged. Independently
      run by this agent before pushing the correction: pytest 139
      passed/1 warning (124 prior baseline + 15 new auto-quarantine
      regression tests), ruff all checks passed, focused mypy on
      database.py/cli.py - no issues found, git diff --check clean. The
      merge itself (c80b1ce into feat/initial-engine, main untouched, no
      deploy) was independently verified by this agent via git fetch and
      the GitHub pull_request_read API after the operator reported it.
    correction_2026-08-08: >-
      Auto-quarantined captures are now reviewable. run_once() calls
      quarantine_unconfirmed() before claim_next(), which moves any
      pending+unconfirmed row to quarantined with a fixed last_error
      before an operator can review it; the original
      list_pending_rights_review()/approve_rights()/reject_rights() only
      matched status='pending', so such a row became invisible to
      rights-list and unrecoverable via rights-approve/rights-reject.
      Fixed: reviewable state is now rights_confirmed=FALSE AND
      (status='pending' OR (status='quarantined' AND last_error equals
      the exact quarantine_unconfirmed() marker)), still via one atomic
      conditional UPDATE per operation. Approval of an auto-quarantined
      row restores status='pending' and clears last_error. Explicit
      operator rejection (last_error='Rights rejected by operator.')
      remains excluded from the default list and from both mutations -
      it is not reviewable. This supersedes the "known limitation" noted
      in the 2026-08-08 HANDOFF entry for this task; that limitation no
      longer exists as of c9054f6. No change to pipeline.py, schema.sql,
      or the HTTP surface.
    allowed_paths:
      - src/robin_content_engine/database.py
      - src/robin_content_engine/cli.py
      - tests/test_database.py
      - tests/test_rights_approval.py
    forbidden_paths:
      - studio/**
      - AGENTS.md
      - CLAUDE.md
      - AI_WORKSPACE/**
      - main
      - schema.sql
      - src/robin_content_engine/api.py
      - src/robin_content_engine/uploader.py
      - src/robin_content_engine/pipeline.py
      - src/robin_content_engine/youtube_auth.py
      - src/robin_content_engine/capture_scan.py
      - client_secret.json
      - client_secret*.json
      - token.json
      - .env
    merge_allowed: false
    deploy_allowed: false
    security_decision: >-
      Rights approval is a sensitive write operation. Per explicit task
      instruction: no new unauthenticated HTTP endpoint for setting
      rights_confirmed=TRUE. This phase is a LOCAL OPERATOR CLI-only
      approval path (robin-engine rights-*). api.py is in forbidden_paths
      - no HTTP mutation added. A future authenticated Studio/API
      approval surface can reuse the same JobRepository domain methods
      later, but that is out of scope here.
    build_vs_adopt: >-
      No new dependency. Reuses the existing FastAPI/Pydantic
      architecture, Typer CLI, and JobRepository as the domain boundary -
      a small domain/CLI workflow does not justify a workflow framework,
      agent framework, or event bus.
    schema_migration_needed: >-
      No. video_queue already supports this via existing status/
      rights_confirmed/rights_note/source_path/source_title fields.
      claim_next()/claim_job() already only match status='pending' AND
      rights_confirmed=TRUE, so approval alone (leaving status at
      'pending') is sufficient for a row to become eligible under the
      existing queue rules - nothing new needed to "enable" it.
      quarantine_job()'s existing 'quarantined' status value fits
      rejection exactly, so no new status was needed either. No audit
      columns (verified_at/verified_by) were required - the append-only
      rights_note already carries the verification/rejection provenance.
    stop_conditions:
      - do not merge to main
      - do not deploy
      - do not add an unauthenticated HTTP endpoint that can set
        rights_confirmed=TRUE
      - do not implement highlight detection, AI clip scoring, video/voice
        generation, autonomous pipeline execution, Content Radar,
        scheduler, publishing automation, analytics, learning loop,
        background filesystem watcher, or a Studio rights UI
      - do not merge PR, do not deploy
      - do not mutate the real production Neon rows (IDs 6/7/8) during
        implementation - read-only until explicit authorization after
