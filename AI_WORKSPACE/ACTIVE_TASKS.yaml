    correction_2026-08-08_candidate_generation: >-
      generate_candidate_windows() previously kept only the single
      np.argmax()-best start position per tested duration, so distinct
      genuine highlights elsewhere in the source could be silently
      discarded before suppress_overlaps() ever ran - confirmed by
      re-running the old algorithm against a 3-peak synthetic fixture,
      which produced exactly one raw candidate. Fixed: now builds a
      candidate for every valid (duration, start) pair via vectorized
      cumsum sliding means (still O(n) per duration), ranks the full pool
      globally by score with a start-time tie-break, truncates to
      max_candidates_before_dedup only after that global ranking, then
      hands off to the unchanged suppress_overlaps(). Per-candidate
      reason now describes the candidate's own aggregate signals via the
      newly-public highlight_scoring.describe_reason(), since every start
      is considered rather than one per duration. Two new regression
      tests (three and five separated synthetic events) verify multiple
      distinct events survive to the final top-N; both were confirmed to
      fail against the old algorithm on the same fixture before this fix.
