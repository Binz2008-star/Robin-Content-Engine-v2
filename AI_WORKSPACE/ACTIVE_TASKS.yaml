  - id: RCE-20260807-CAPTURE
    title: Phase 5 — Local Capture Source Integration
    status: complete
    owner: claude
    branch: feat/local-capture-source
    base_branch: feat/initial-engine
    base_sha: 8a55704611bb4ae666951db487013a818f44730c
    final_sha: ce23bd33e3d61f0e951ac1a8bf23f3640929fdae
    pr: 9
    merged: true
    merge_method: squash
    merge_commit_sha: a0feaedcf6e47f1aeca0ccc76dbba37d6bc704e1
    merged_into: feat/initial-engine
    result_sha_on_feat_initial_engine: a0feaedcf6e47f1aeca0ccc76dbba37d6bc704e1
    merged_by: Binz2008-star
    ci: >-
      Verified via GitHub: check run "test" completed/success on final_sha
      ce23bd33e3d61f0e951ac1a8bf23f3640929fdae. Independently re-run by
      this agent immediately before merging: pytest 96 passed/1 warning,
      ruff all checks passed, focused mypy on capture_scan.py/cli.py/
      config.py - no issues found, git diff --check clean.
    rights_safety_correction: >-
      Real local smoke surfaced that capture_scan.py originally called
      JobRepository.enqueue_local(), which hardcodes rights_confirmed=
      TRUE - meaning every discovered file (including non-gameplay files
      that happened to be in the capture folder) was auto-confirmed for
      publishing rights just by existing there. Fixed by switching to the
      existing, unmodified JobRepository.enqueue_api_job() (already took
      rights_confirmed as an explicit parameter) and passing
      rights_confirmed=False for every capture-scan discovery, with a
      provenance rights_note stating rights require explicit
      verification. No schema/database.py change. This correctly engages
      the existing Rights Gate (quarantine_unconfirmed()) rather than
      weakening it.
    production_remediation: >-
      Operator reported: 3 Neon production rows (IDs 6, 7, 8, created by
      the first pre-fix smoke) corrected to status=pending,
      rights_confirmed=false, with the corrected provenance rights_note.
      No other rows modified. NOT independently verified by this agent -
      the Neon MCP connector remained connected at the org level but not
      enabled in this chat session throughout this task, so this agent
      never queried production Neon directly at any point in this phase.
    count_discrepancy_item9: >-
      15 vs 16 unsupported-file count: reviewed the extension-filtering
      code, no bug found. desktop.ini (.ini) would be counted as
      skipped_unsupported identically to any other non-allowed extension;
      nothing in the scan loop special-cases or skips hidden/system
      files. Most likely a difference in how the operator described the
      count in natural language, or desktop.ini not actually present at
      scan time - not a scanner defect. No speculative fix was made.
    note: >-
      PR #9 body updated to remove stale pre-fix language
      (enqueue_local()/rights_confirmed=TRUE claims) before merge, marked
      ready for review, re-confirmed immediately before merging (head
      unchanged, mergeable_state=clean, CI still success), then
      squash-merged. Merge commit a0feaedcf6e47f1aeca0ccc76dbba37d6bc704e1
      verified as the new feat/initial-engine HEAD via git fetch. main
      independently re-confirmed unchanged
      (5387af1f14888964b463b1fcaed8751d40ecbde6, same as at the start of
      this entire engagement). No deploy performed.
    allowed_paths:
      - src/robin_content_engine/capture_scan.py
      - src/robin_content_engine/config.py
      - src/robin_content_engine/cli.py
      - tests/test_capture_scan.py
      - .env.example
    forbidden_paths:
      - studio/**
      - AGENTS.md
      - CLAUDE.md
      - AI_WORKSPACE/**
      - main
      - schema.sql
      - src/robin_content_engine/database.py
      - src/robin_content_engine/uploader.py
      - src/robin_content_engine/pipeline.py
      - client_secret.json
      - client_secret*.json
      - token.json
      - .env
    merge_allowed: false
    deploy_allowed: false
    build_vs_adopt: >-
      Evaluated before coding: no new dependency justified. Scope is a
      single non-recursive directory listing, extension filtering, and a
      two-snapshot stat()-based stability check — stdlib pathlib/os
      fully covers this. A filesystem-watcher library (e.g. watchdog)
      was considered and explicitly rejected: the phase brief requires a
      manual scan command only, not a background watcher. Decision:
      stdlib-only implementation, zero new dependencies.
    duplicate_detection_strategy: >-
      Resolved absolute file path checked against existing
      video_queue.source_path values (via the existing
      JobRepository.list_jobs(), reused as-is) before insert. No schema
      change: no uniqueness is enforced at the DB level, only at the
      application layer during a single sequential manual scan (no
      concurrent writers in this phase, so this is sufficient).
    file_stability_strategy: >-
      Two stat() snapshots (size + mtime) of a candidate file taken a
      short configurable interval apart (default 2.0s, Settings-
      configurable); only registered if unchanged, otherwise skipped
      this run (will be reconsidered on the next scan) — guards against
      ingesting a file Xbox Game Bar is still actively writing.
    schema_migration_needed: >-
      No. video_queue already supports this use case via existing
      source_path/source_title/rights_confirmed/rights_note fields and
      the existing enqueue_api_job()/list_jobs() methods, both reused
      unmodified. database.py is in forbidden_paths for this task.
    stop_conditions:
      - do not merge to main
      - do not deploy
      - do not modify, move, rename, or delete original capture files
      - never read, print, commit, log, or expose .env, token.json,
        client_secret*.json, or any access/refresh token or API key
      - do not introduce a database/schema migration without stopping
        and reporting it first — none is pre-authorized this phase
      - do not start highlight detection, AI clip scoring, Content
        Radar, autonomous production, scheduler, publishing automation,
        analytics/learning loop, or a background directory watcher —
        those are later phases
      - do not call render/upload from capture-scan
    next_action: >-
      Phase 5 closed. Wait for explicit human direction before starting
      any further phase (highlight detection, Content Radar, autonomous
      production, scheduler, analytics/learning loop, background
      watcher). New baseline for the next phase is feat/initial-engine @
      a0feaedcf6e47f1aeca0ccc76dbba37d6bc704e1. If the operator wants
      independent verification of the production row remediation
      (item 8), enable the Neon connector for this chat.

