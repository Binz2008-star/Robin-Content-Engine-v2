[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robin-content-engine"
version = "0.1.0"
description = "Rights-aware automated production pipeline for original gaming Shorts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.2,<8",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.2,<2",
  "uvicorn>=0.30,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "moviepy>=2.1,<3",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "openai>=1.68,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "scenedetect-headless>=0.7.1,<0.8",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
robin-engine = "robin_content_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/robin_content_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["robin_content_engine"]

[[tool.mypy.overrides]]
module = ["scenedetect.*", "moviepy.*", "faster_whisper.*", "imageio_ffmpeg.*"]
ignore_missing_imports = true
