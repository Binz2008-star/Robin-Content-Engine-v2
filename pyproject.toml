[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robin-content-engine"
version = "0.1.0"
description = "Rights-aware automated production pipeline for original gaming Shorts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.2,<8",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.2,<2",
  "uvicorn>=0.30,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "moviepy>=2.1,<3",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "openai>=1.68,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "scenedetect-headless>=0.7.1,<0.8",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  # Official type stubs for the optional yt-dlp dependency, so mypy can
  # type-check channel_import.py's lazy `import yt_dlp` instead of being
  # told to ignore it.
  "types-yt-dlp>=2026.7,<2027",
]
# Optional: downloading own-channel videos for `robin-engine channel-import`.
download = [
  "yt-dlp>=2025.1.0",
]

[project.scripts]
robin-engine = "robin_content_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/robin_content_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
# moviepy's bundled ffmpeg reader mutates a numpy array's .shape attribute,
# which numpy 2.5 deprecated (and will eventually remove). It is a known,
# benign library bug we cannot fix from here - silence exactly that
# DeprecationWarning (by message) so genuinely NEW warnings stay visible.
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# controlpanel.py embeds a one-page HTML dashboard as a literal string;
# its CSS/JS lines are intentionally long and are not Python code.
"src/robin_content_engine/controlpanel.py" = ["E501"]

[tool.mypy]
# The deployed runtime interpreter is 3.12 (the shared .venv); the
# installed numpy type stubs also require 3.12 syntax.
python_version = "3.12"
strict = true
packages = ["robin_content_engine"]
# Resolve the package from THIS repository's src/ layout, never from a
# pip-installed copy in the active environment (the shared .venv has a
# different (v2) build installed; without this, mypy follows the
# installed package and fails with "missing py.typed marker").
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["scenedetect.*", "moviepy.*", "faster_whisper.*", "imageio_ffmpeg.*"]
ignore_missing_imports = true
